name: Site quality and sitemap

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate sitemap
        run: node scripts/update-sitemap.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate site structure and links
        run: node scripts/validate-site.mjs

      - name: Commit updated sitemap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sitemap"
            git push
          fi
